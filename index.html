        const getEffectivePrice = (item) => {
            if (item.discount && item.discount > 0) {
                return Math.max(0, Math.round(item.price * (1 - item.discount / 100)));
            }
            return item.price;
        };

        const getRatingDisplay = (item) => item.reviews > 0 ? getRatingValue(item).toFixed(1) : '0.0';

        const getLocalDateString = (d = new Date()) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;

        function AppProvider({ children }) {

            const [appMode, setAppMode] = useState('customer');

            const [showAdminPinModal, setShowAdminPinModal] = useState(false);

            const [promos] = useState([{ code: 'KHAN20', discount: 0.20, active: true }]);
            
            // Persistent Orders & Counter via LocalStorage
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('khan_orders');
                return saved ? JSON.parse(saved) : [];
            });

            const [orderCounter, setOrderCounter] = useState(() => {
                const saved = localStorage.getItem('khan_order_counter');
                const savedDate = localStorage.getItem('khan_counter_date');
                const today = getLocalDateString();
                if (savedDate === today && saved) {
                    return parseInt(saved, 10);
                }
                return 0;
            });

            const [orderType, setOrderType] = useState('dineIn');
            const [cart, setCart] = useState([]);
            const [activePromo, setActivePromo] = useState(null);
            const [activeOrderId, setActiveOrderId] = useState(null);
            const [customerView, setCustomerView] = useState('home');

            const t = translations[lang];
            const isAr = lang === 'ar';

            // Sync localStorage on orders/counter change
            useEffect(() => {
                localStorage.setItem('khan_orders', JSON.stringify(orders));
            }, [orders]);

            useEffect(() => {
                localStorage.setItem('khan_order_counter', orderCounter.toString());
                localStorage.setItem('khan_counter_date', getLocalDateString());
            }, [orderCounter]);

            // Midnight / New day check for daily counter reset
            useEffect(() => {
                const checkNewDay = () => {
                    const savedDate = localStorage.getItem('khan_counter_date');
                    const today = getLocalDateString();
                    if (savedDate && savedDate !== today) {
                        setOrderCounter(0);
                        localStorage.setItem('khan_counter_date', today);
                    }
                };
                const interval = setInterval(checkNewDay, 10000);
                return () => clearInterval(interval);
            }, []);

            // Auto-progress order statuses based on elapsed time
            useEffect(() => {
                const interval = setInterval(() => {
                    setOrders(prev => {
                        let changed = false;
                        const next = prev.map(o => {
                            if (o.status === 'completed') return o;
                            const elapsedSec = (Date.now() - new Date(o.date).getTime()) / 1000;
                            let newStatus = o.status;
                            
                            if (o.type === 'delivery') {
                                if (newStatus === 'pending' && elapsedSec >= 60) newStatus = 'preparing';
                                if (newStatus === 'preparing' && elapsedSec >= 20 * 60) newStatus = 'delivering';
                                if (elapsedSec >= 45 * 60) newStatus = 'completed';
                            } else {
                                if (newStatus === 'pending' && elapsedSec >= 60) newStatus = 'preparing';
                                if (elapsedSec >= 20 * 60) newStatus = 'completed';
                            }

                            if (newStatus !== o.status) {
                                changed = true;
                                return { ...o, status: newStatus };
                            }
                            return o;
                        });
                        return changed ? next : prev;
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, []);

                const effectivePrice = getEffectivePrice(item);

                    const ex = prev.find(i => i.id === item.id);

                    return [...prev, { ...item, price: effectivePrice, originalPrice: item.price, qty: 1 }];

            const updateQty = (id, delta) => {

            const applyPromo = (code) => {

                const tax = (subtotal - discount) * 0.15;
                const deliveryFee = orderType === 'delivery' ? 5000 : 0;
                const total = (subtotal - discount) + tax + deliveryFee;

                const nextNum = orderCounter + 1;
                setOrderCounter(nextNum);

                const now = new Date();
                const newOrder = {
                    id: `#${nextNum}`,
                    dailyNum: nextNum,
                    dateStr: getLocalDateString(now),
                    type: orderType,
                    details: customerDetails,
                    items: [...cart],
                    totals: { subtotal, discount, tax, deliveryFee, total },
                    status: 'pending',
                    date: now
                };

                setOrders([newOrder, ...orders]);
                        if (customerDetails.email) {
            fetch('/api/send-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

                    email: customerDetails.email,

                    total: total,
                    items: cart

            }).catch(err => console.error("Email send failed:", err));

                setCart([]);

                        ratingSum: 0,
                        reviews: 0,
                        available: data.available !== undefined ? data.available : true
                    }
                ]);
            };

    <input

                        {t.checkout}

        const LiveTimer = ({ orderDate, status, orderType }) => {
            const { t } = useContext(AppContext);
            const totalSeconds = orderType === 'delivery' ? 45 * 60 : 20 * 60;
            const [timeLeft, setTimeLeft] = useState(totalSeconds);

            useEffect(() => {
                if (status === 'completed') {
                    setTimeLeft(0);
                    return;
                }
                const tick = () => {
                    const elapsed = Math.floor((Date.now() - new Date(orderDate).getTime()) / 1000);
                    setTimeLeft(Math.max(totalSeconds - elapsed, 0));
                };
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [orderDate, status, totalSeconds]);

            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');

            return (
                <div className="inline-flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-full border border-slate-700">
                    {status !== 'completed' && <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-fast"></span>}

        // ==========================================

        const emptyForm = { nameAr: '', descAr: '', price: '', discount: '', cat: CATEGORIES[0].id, img: '', available: true };

        const AdminApp = () => {
            const { t, isAr, orders, menuItems, updateOrderStatus, toggleItemAvailability, addMenuItem, updateMenuItem, deleteMenuItem, resetAllData } = useContext(AppContext);
            const [adminTab, setAdminTab] = useState('dash');
            const [reportView, setReportView] = useState('daily');
            const [selectedDateStr, setSelectedDateStr] = useState(getLocalDateString());
            const [menuModal, setMenuModal] = useState(null);

            const now = new Date();
            const currentMonthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            // Filtering Orders for Daily & Monthly Analytics
            const dailyOrders = useMemo(() => {
                return orders.filter(o => {
                    const d = new Date(o.date);
                    return getLocalDateString(d) === selectedDateStr && o.status === 'completed';
                });
            }, [orders, selectedDateStr]);

            const monthlyOrders = useMemo(() => {
                return orders.filter(o => {
                    const d = new Date(o.date);
                    const mStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    return mStr === currentMonthStr && o.status === 'completed';
                });
            }, [orders, currentMonthStr]);

            // Analytics Metrics Calculation
            const calcMetrics = (targetOrders) => {
                const totalRevenue = targetOrders.reduce((sum, o) => sum + o.totals.total, 0);
                const netProfit = totalRevenue * 0.35;
                const orderCount = targetOrders.length;

                const itemCounts = {};
                targetOrders.forEach(o => {
                    o.items.forEach(i => {
                        itemCounts[i.id] = (itemCounts[i.id] || 0) + i.qty;
                    });
                });

                const topDishes = [...menuItems].sort((a, b) => {
                    const countA = itemCounts[a.id] || 0;
                    const countB = itemCounts[b.id] || 0;
                    if (countB !== countA) return countB - countA;
                    return getRatingValue(b) - getRatingValue(a);
                }).slice(0, 5);

                const avgRating = menuItems.reduce((acc, cur) => acc + getRatingValue(cur), 0) / (menuItems.length || 1);

                return { totalRevenue, netProfit, orderCount, topDishes, itemCounts, avgRating: avgRating.toFixed(1) };
            };

            const dailyMetrics = calcMetrics(dailyOrders);
            const monthlyMetrics = calcMetrics(monthlyOrders);

            // MODIFICATION 1: Real PDF Download Handler using html2pdf
            const exportPdf = (type) => {
                const isDaily = type === 'daily';
                const metrics = isDaily ? dailyMetrics : monthlyMetrics;
                const title = isDaily ? `${t.dailyReportTitle} (${selectedDateStr})` : `${t.monthlyReportTitle} (${currentMonthStr})`;
                const filename = isDaily ? `Khan_AlSharq_Daily_Report_${selectedDateStr}.pdf` : `Khan_AlSharq_Monthly_Report_${currentMonthStr}.pdf`;

                // Build a styled, dedicated container for the PDF
                const element = document.createElement('div');
                element.dir = isAr ? 'rtl' : 'ltr';

                element.style.color = '#0f172a';
                element.style.backgroundColor = '#ffffff';

                    <div style="text-align: center; border-bottom: 2px solid #d97706; padding-bottom: 12px; margin-bottom: 20px;">

                        <p style="font-size: 11px; color: #64748b; margin: 0;">تاريخ التصدير: ${new Date().toLocaleString(isAr ? 'ar-IQ' : 'en-US')}</p>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px;">
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;">
                            <span style="font-size: 12px; color: #64748b; display: block; margin-bottom: 4px;">إجمالي المبيعات</span>
                            <strong style="font-size: 18px; color: #059669;">${metrics.totalRevenue.toLocaleString()} ${t.currency}</strong>
                        </div>
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;">
                            <span style="font-size: 12px; color: #64748b; display: block; margin-bottom: 4px;">صافي الأرباح (35%)</span>
                            <strong style="font-size: 18px; color: #d97706;">${metrics.netProfit.toLocaleString()} ${t.currency}</strong>
                        </div>
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;">
                            <span style="font-size: 12px; color: #64748b; display: block; margin-bottom: 4px;">إجمالي عدد الطلبات</span>
                            <strong style="font-size: 18px; color: #0f172a;">${metrics.orderCount} ${t.orderWord}</strong>
                        </div>
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px;">
                            <span style="font-size: 12px; color: #64748b; display: block; margin-bottom: 4px;">متوسط التقييم العام</span>
                            <strong style="font-size: 18px; color: #d97706;">${metrics.avgRating} ⭐</strong>
                        </div>
                    </div>

                    <div style="margin-top: 15px;">
                        <h3 style="font-size: 15px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 12px;">الأطباق الأكثر طلباً</h3>
                        ${metrics.topDishes.length === 0 ? '<p style="font-size: 12px; color: #94a3b8;">لا توجد طلبات مكتملة لهذه الفترة.</p>' : `
                        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
                            <thead>
                                <tr style="background: #f1f5f9; text-align: ${isAr ? 'right' : 'left'};">
                                    <th style="padding: 10px; border: 1px solid #cbd5e1;">اسم الطبق</th>
                                    <th style="padding: 10px; border: 1px solid #cbd5e1; width: 120px;">عدد الطلبات</th>
                                    <th style="padding: 10px; border: 1px solid #cbd5e1; width: 90px;">التقييم</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${metrics.topDishes.map(dish => `
                                    <tr>
                                        <td style="padding: 8px 10px; border: 1px solid #cbd5e1;">${dish.nameAr}</td>
                                        <td style="padding: 8px 10px; border: 1px solid #cbd5e1; font-weight: bold; color: #d97706;">${metrics.itemCounts[dish.id] || 0} ${t.orderWord}</td>
                                        <td style="padding: 8px 10px; border: 1px solid #cbd5e1;">${getRatingDisplay(dish)} ⭐</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                        `}
                    </div>

                    <div style="margin-top: 35px; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 12px; font-size: 10px; color: #94a3b8;">
                        تقرير رسمي موثق مُولد من نظام خان الشرق الرقمي - جميع الحقوق محفوظة © ${new Date().getFullYear()}
                    </div>
                `;

                if (window.html2pdf) {
                    const opt = {
                        margin:       10,
                        filename:     filename,
                        image:        { type: 'jpeg', quality: 0.98 },
                        html2canvas:  { scale: 2, useCORS: true },
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    window.html2pdf().set(opt).from(element).save();
                } else {
                    // Fallback to iframe printing if CDN blocked
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                    const doc = iframe.contentWindow.document;
                    doc.open();
                    doc.write('<html><head><title>' + filename + '</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"></head><body style="margin:0;">' + element.outerHTML + '</body></html>');
                    doc.close();
                    setTimeout(() => {
                        iframe.contentWindow.focus();
                        iframe.contentWindow.print();
                        document.body.removeChild(iframe);

            const handleSaveNew = (data) => { addMenuItem(data); setMenuModal(null); };
            const handleSaveEdit = (data) => { updateMenuItem(editingItem.id, data); setMenuModal(null); };
            const handleDelete = (id) => { if (confirm('هل أنت متأكد من حذف هذا الطبق؟')) deleteMenuItem(id); };
            const handleReset = () => { if (confirm('سيتم تصفير كل الطلبات والمبيعات والتقييمات. هل تريد المتابعة؟')) resetAllData(); };

            return (
                <div className="min-h-screen bg-slate-950 animate-fade-in pb-20">

                            { id: 'dash', label: t.adminDash, icon: <Icons.Chart /> },

                                {tab.icon} {tab.label}

                    </div>

                    <div className="p-4">
                        {/* Dashboard & Analytics Tab */}
                        {adminTab === 'dash' && (
                            <div className="space-y-6 animate-slide-up">
                                {/* Sub View Selector */}
                                <div className="grid grid-cols-2 gap-2 glass p-1 rounded-2xl border border-slate-800">
                                    <button onClick={() => setReportView('daily')} className={`py-2.5 rounded-xl text-xs font-bold transition-all ${reportView === 'daily' ? 'bg-gold-600 text-slate-900 shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        {t.dailySales}
                                    </button>
                                    <button onClick={() => setReportView('monthly')} className={`py-2.5 rounded-xl text-xs font-bold transition-all ${reportView === 'monthly' ? 'bg-gold-600 text-slate-900 shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                        {t.monthlySales}
                                    </button>
                                </div>

                                {reportView === 'daily' ? (
                                    /* Daily Analytics View */
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between glass p-3 rounded-2xl border border-slate-800">
                                            <span className="text-xs text-slate-400 font-bold">{isAr ? 'اختر التاريخ:' : 'Select Date:'}</span>
                                            <input type="date" value={selectedDateStr} onChange={e => setSelectedDateStr(e.target.value)} className="bg-slate-900 border border-slate-700 text-gold-400 text-xs rounded-xl px-3 py-1.5 outline-none" />
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.dailySales}</p>
                                                <p className="text-lg font-bold text-emerald-400">{dailyMetrics.totalRevenue.toLocaleString()} {t.currency}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.netProfit}</p>
                                                <p className="text-lg font-bold text-gold-400">{dailyMetrics.netProfit.toLocaleString()} {t.currency}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.ordersCount}</p>
                                                <p className="text-lg font-bold text-white">{dailyMetrics.orderCount} {t.orderWord}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.avgRating}</p>
                                                <p className="text-lg font-bold text-gold-400">{dailyMetrics.avgRating} ⭐</p>
                                            </div>
                                        </div>

                                        <div className="glass p-5 rounded-2xl border border-slate-800">
                                            <h3 className="font-bold text-white mb-4">{t.topDishes}</h3>
                                            {dailyMetrics.orderCount === 0 ? (
                                                <p className="text-sm text-slate-500">{t.noCompletedOrders}</p>
                                            ) : (
                                                <div className="space-y-4">
                                                    {dailyMetrics.topDishes.map((item, idx) => {
                                                        const count = dailyMetrics.itemCounts[item.id] || 0;
                                                        return (
                                                            <div key={item.id}>
                                                                <div className="flex justify-between text-sm mb-1">
                                                                    <span className="text-slate-300">{item.nameAr} <span className="text-xs text-slate-500">({count} {t.orderWord})</span></span>
                                                                    <span className="text-gold-400 font-bold">{getRatingDisplay(item)} ⭐</span>
                                                                </div>
                                                                <div className="w-full bg-slate-800 rounded-full h-2">
                                                                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 h-2 rounded-full" style={{ width: `${Math.max(100 - (idx*20), 10)}%` }}></div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>

                                        <button onClick={() => exportPdf('daily')} className="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-emerald-500 text-slate-950 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 active:scale-95 transition-transform">
                                            <Icons.Download /> {t.downloadDailyPdf}
                                        </button>
                                    </div>
                                ) : (
                                    /* Monthly Analytics View */
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.monthlySales}</p>
                                                <p className="text-lg font-bold text-emerald-400">{monthlyMetrics.totalRevenue.toLocaleString()} {t.currency}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.netProfit}</p>
                                                <p className="text-lg font-bold text-gold-400">{monthlyMetrics.netProfit.toLocaleString()} {t.currency}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.ordersCount}</p>
                                                <p className="text-lg font-bold text-white">{monthlyMetrics.orderCount} {t.orderWord}</p>
                                            </div>
                                            <div className="glass p-4 rounded-2xl border border-slate-800">
                                                <p className="text-xs text-slate-400 mb-1">{t.avgRating}</p>
                                                <p className="text-lg font-bold text-gold-400">{monthlyMetrics.avgRating} ⭐</p>
                                            </div>
                                        </div>

                                        <div className="glass p-5 rounded-2xl border border-slate-800">
                                            <h3 className="font-bold text-white mb-4">{t.topDishes}</h3>
                                            {monthlyMetrics.orderCount === 0 ? (
                                                <p className="text-sm text-slate-500">{t.noCompletedOrders}</p>
                                            ) : (
                                                <div className="space-y-4">
                                                    {monthlyMetrics.topDishes.map((item, idx) => {
                                                        const count = monthlyMetrics.itemCounts[item.id] || 0;
                                                        return (
                                                            <div key={item.id}>
                                                                <div className="flex justify-between text-sm mb-1">
                                                                    <span className="text-slate-300">{item.nameAr} <span className="text-xs text-slate-500">({count} {t.orderWord})</span></span>
                                                                    <span className="text-gold-400 font-bold">{getRatingDisplay(item)} ⭐</span>
                                                                </div>
                                                                <div className="w-full bg-slate-800 rounded-full h-2">
                                                                    <div className="bg-gradient-to-r from-gold-600 to-gold-400 h-2 rounded-full" style={{ width: `${Math.max(100 - (idx*20), 10)}%` }}></div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}
                                        </div>

                                        <button onClick={() => exportPdf('monthly')} className="w-full py-3.5 bg-gradient-to-r from-gold-600 to-gold-500 text-slate-950 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-gold-600/20 active:scale-95 transition-transform">
                                            <Icons.Download /> {t.downloadMonthlyPdf}
                                        </button>
                                    </div>
                                )}

                                <button onClick={handleReset} className="w-full py-3 glass border border-slate-700 text-slate-300 rounded-xl font-bold flex items-center justify-center gap-2 hover:border-red-500 hover:text-red-400 transition-all">
                                    <Icons.Reset /> {t.resetData}
                                </button>
                            </div>
                        )}

                        {/* Live Orders Tab */}
                        {adminTab === 'orders' && (
                            <div className="space-y-4 animate-slide-up">
                                {orders.length === 0 ? <p className="text-center text-slate-500 mt-10">{t.noOrders}</p> :
                                orders.map(order => {
                                    const elapsedMin = Math.floor((Date.now() - new Date(order.date).getTime()) / 60000);
                                    const adminStatuses = order.type === 'delivery'
                                        ? ['pending', 'preparing', 'delivering', 'completed']
                                        : ['pending', 'preparing', 'completed'];

                                    return (
                                    <div key={order.id} className="glass p-5 rounded-2xl border border-slate-700">
                                        <div className="flex justify-between items-center mb-3 border-b border-slate-800 pb-3">
                                            <div>
                                                <h3 className="font-bold text-gold-400 text-lg">{order.id}</h3>
                                                <p className="text-xs text-slate-400">{order.type === 'dineIn' ? `${t.table}: ${order.details.table}` : `${t.deliveryTo}: ${order.details.name}`}</p>
                                                {order.status !== 'completed' && <p className="text-[10px] text-slate-500 mt-1">{elapsedMin} {t.minutesElapsed}</p>}
                                            </div>
                                            <span className="text-lg font-bold text-white">{order.totals.total.toLocaleString()} {t.currency}</span>
                                        </div>
                                        <div className="flex gap-2 mt-4 overflow-x-auto hide-scrollbar">
                                            {adminStatuses.map(status => (
                                                <button key={status} onClick={() => updateOrderStatus(order.id, status)} className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition-all ${order.status === status ? 'bg-gold-600 text-slate-900' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                                    {t[`status_${status}`]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* Menu CRUD Tab */}
                        {adminTab === 'menu' && (
                            <div className="space-y-4 animate-slide-up">
                                <button onClick={() => setMenuModal('new')} className="w-full py-3 bg-gradient-to-r from-gold-600 to-gold-500 text-slate-900 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-gold-600/30 active:scale-95 transition-transform">
                                    <Icons.Plus /> {t.addNewDish}
                                </button>
                                {menuItems.map(item => (
                                    <div key={item.id} className="glass p-4 rounded-2xl border border-slate-700">
                                        <div className="flex items-center justify-between gap-3">
                                            <div className="flex items-center gap-3 flex-1 min-w-0">
                                                <img src={item.img} className="w-14 h-14 rounded-lg object-cover flex-shrink-0" />
                                                <div className="min-w-0">
                                                    <h4 className="font-bold text-white text-sm truncate">{item.nameAr}</h4>
                                                    <p className="text-xs text-gold-400">
                                                        {getEffectivePrice(item).toLocaleString()} {t.currency}
                                                        {item.discount > 0 && <span className="text-slate-500 line-through mx-1">{item.price.toLocaleString()}</span>}
                                                        {' '}| {getRatingDisplay(item)} ⭐ ({item.reviews})
                                                    </p>
                                                    <p className="text-[10px] text-slate-500">{isAr ? CATEGORIES.find(c => c.id === item.cat)?.labelAr : CATEGORIES.find(c => c.id === item.cat)?.labelEn}</p>
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-2 items-end flex-shrink-0">
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${item.available ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'}`}>{item.available ? t.available : t.unavailable}</span>
                                                <div className="flex gap-2">
                                                    <button onClick={() => toggleItemAvailability(item.id)} className="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center hover:bg-slate-700"><Icons.Check /></button>
                                                    <button onClick={() => setMenuModal(item.id)} className="w-8 h-8 rounded-lg bg-slate-800 text-gold-400 flex items-center justify-center hover:bg-slate-700"><Icons.Edit /></button>
                                                    <button onClick={() => handleDelete(item.id)} className="w-8 h-8 rounded-lg bg-slate-800 text-red-400 flex items-center justify-center hover:bg-slate-700"><Icons.Trash /></button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {menuModal === 'new' && (
                        <MenuItemForm onCancel={() => setMenuModal(null)} onSave={handleSaveNew} />
                    )}
                    {editingItem && (
                        <MenuItemForm
                            initial={{
                                nameAr: editingItem.nameAr,
                                descAr: editingItem.descAr,
                                price: editingItem.price, discount: editingItem.discount,
                                cat: editingItem.cat, img: editingItem.img, available: editingItem.available
                            }}
                            onCancel={() => setMenuModal(null)}
                            onSave={handleSaveEdit}
                        />
                    )}
                </div>
            );
        };

        // ==========================================
        // 8. Main App Wrapper
        // ==========================================
        const MainApp = () => {
            const { appMode } = useContext(AppContext);
            return (
                <div className="min-h-screen max-w-md mx-auto bg-slate-900 shadow-2xl relative overflow-hidden">
                    <Navbar />
                    {appMode === 'customer' ? <CustomerApp /> : <AdminApp />}
                    <AdminPinModal />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppProvider><MainApp /></AppProvider>);
    </script>
</body>
  </html>
